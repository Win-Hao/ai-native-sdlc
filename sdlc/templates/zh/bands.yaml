# 控制带配置：检测层保持确定性，模型只在越界后被唤起。
metric: ci_test_failure_rate      # 或 post_deploy_5xx_rate / pr_cycle_time
baseline: rolling_30d
rules: western_electric           # 同时捕捉尖峰与缓慢漂移

tiers:
  1sigma:
    action: log                   # 只记录，不唤起
  2sigma:
    action: diagnose              # 只读诊断
    tools: "Read,Grep,Bash(gh run view *)"
  3sigma:
    action: propose               # 可以动作，但只能走已批准的路径
    routes:
      - pull_request              # 开 PR 进 review gate
      - runbook:rollback-deploy   # 触发预批准的 runbook

output:
  intent_dir: sdlc/               # 诊断结果写成 intent.md 重新进入 Stage 1
  triage_owner: <service owner>
